databases:
  - name: laravel-postgres-db
    databaseName: laravel
    plan: free

services:
  - type: web
    name: laravel-web-app
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PHP_CATCHALL
        value: "1"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: laravel-postgres-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: laravel-postgres-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
